{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}GreenTube{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f8f6;
            color: #26352d;
        }

        a {
            text-decoration: none;
            color: #4A7C59;
        }

        a:hover {
            color: #00A86B;
        }

        header {
            background-color: #FFFFFF;
            border-bottom: 1px solid #dfe8e2;
            padding: 18px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4A7C59;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            font-weight: 600;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .btn {
            display: inline-block;
            background-color: #00A86B;
            color: #FFFFFF;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #4A7C59;
            color: #FFFFFF;
        }

        .btn-secondary {
            background-color: #4A7C59;
        }

        .btn-danger {
            background-color: #b94a48;
        }

        .card {
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(74, 124, 89, 0.10);
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            margin-bottom: 18px;
            border: 1px solid #cddbd2;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #00A86B;
        }

        label {
            font-weight: bold;
            color: #4A7C59;
        }

        .form-box {
            max-width: 500px;
            margin: 50px auto;
        }

        .form-box h1 {
            margin-bottom: 25px;
            color: #4A7C59;
        }

        .error {
            background-color: #ffe9e9;
            color: #a33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background-color: #e7f7ef;
            color: #28744b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .video-card {
            background-color: #FFFFFF;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(74, 124, 89, 0.10);
            transition: 0.2s;
        }

        .video-card:hover {
            transform: translateY(-3px);
        }

        .video-card-content {
            padding: 18px;
        }

        .video-card h3 {
            margin-bottom: 8px;
            color: #26352d;
        }

        .category {
            display: inline-block;
            color: #FFFFFF;
            background-color: #4A7C59;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .channel-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
        }

        .channel-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 25px;
        }

        .channel-header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin: 20px 0;
        }

        .stat {
            background-color: #f0f6f2;
            padding: 15px 25px;
            border-radius: 10px;
        }

        .comment {
            background-color: #f5f8f6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .reply {
            margin-left: 40px;
            border-left: 3px solid #00A86B;
            padding-left: 15px;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            color: #4A7C59;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            margin: 0;
        }

        @media (max-width: 700px) {
            header {
                padding: 15px 20px;
            }

            nav {
                gap: 10px;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="{% url 'home' %}" class="logo">
        django-youtube
    </a>

    <nav>

        <a href="{% url 'video_list' %}">
            videos
        </a>

        <a href="{% url 'search' %}">
            search
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'profile' %}">
                profile
            </a>

            <a href="{% url 'create_channel' %}">
                create channel
            </a>

            <a href="{% url 'upload_video' %}">
                upload
            </a>

            <a href="{% url 'logout' %}">
                logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                login
            </a>

            <a href="{% url 'register' %}" class="btn">
                register
            </a>

        {% endif %}

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>
    django-youtube 2026
</footer>

</body>
</html>
