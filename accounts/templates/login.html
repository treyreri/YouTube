 {% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-box card">

    <h1>Login</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username">

        <label>Password</label>
        <input type="password" name="password">

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <p style="margin-top: 20px;">
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
